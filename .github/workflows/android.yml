# Checks that the copy of the shared specification in spec/ is equal to the cvkefridge repository.
# Builds the Android app, runs lint and the unit tests, compiles the device tests, and builds the release APK and the
# release bundle for Google Play. CI has no upload key, so the release outputs are unsigned.
# A second job runs the device tests on an emulator.
name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check the copy of the shared specification
        run: python3 scripts/update-spec.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, and unit tests
        run: >
          ./gradlew --stacktrace
          :core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest
          :app:assembleRelease :app:bundleRelease
      - name: Upload the lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
            core/build/reports/
            core/build/test-results/
          if-no-files-found: ignore

  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest
      - name: Upload the device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
